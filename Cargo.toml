[package]
name = "twyla"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }

# Pinned to typst main for the bundle export feature (multi-document output,
# `#document(path)` + `#asset()`). Switch back to crates.io once 0.15 ships.
# Bump deliberately; do not let `cargo update -p typst` move us.
typst = { git = "https://github.com/typst/typst", rev = "de6f400976f9bf6ab8b923d13a068722959d0070" }
typst-bundle = { git = "https://github.com/typst/typst", rev = "de6f400976f9bf6ab8b923d13a068722959d0070" }
typst-html = { git = "https://github.com/typst/typst", rev = "de6f400976f9bf6ab8b923d13a068722959d0070" }
typst-kit = { git = "https://github.com/typst/typst", rev = "de6f400976f9bf6ab8b923d13a068722959d0070", default-features = false, features = ["scan-fonts", "embedded-fonts", "watcher"] }
typst-library = { git = "https://github.com/typst/typst", rev = "de6f400976f9bf6ab8b923d13a068722959d0070" }
# Referenced by the `#[func]` macro expansion (`typst_utils::Static`); a
# direct dep so twyla can define native typst builtins. Same pinned rev.
typst-utils = { git = "https://github.com/typst/typst", rev = "de6f400976f9bf6ab8b923d13a068722959d0070" }
comemo = "0.5"
ecow = "0.2"

# Path-aware file watcher for `static/` (serve hot-reload). The typst
# watcher only signals "something changed"; this one surfaces the changed
# path so the browser can swap a single asset in place. Already in the
# tree transitively via typst-kit.
notify = "8"

# HTML AST diff harness (porting verification)
html5ever = "0.39"
markup5ever_rcdom = "0.39"

# Markdown → typst draft generator (`twyla import`).
pulldown-cmark = { version = "0.13", default-features = false }
toml = "0.9"
