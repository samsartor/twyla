[package]
name = "twyla"
version = "0.1.0"
edition = "2024"

[dependencies]
# Pinned to typst main for the bundle export feature (multi-document output,
# `#document(path)` + `#asset()`). Switch back to crates.io once 0.15 ships.
# Bump deliberately; do not let `cargo update -p typst` move us.
typst = { git = "https://github.com/typst/typst", rev = "de6f400976f9bf6ab8b923d13a068722959d0070" }
typst-bundle = { git = "https://github.com/typst/typst", rev = "de6f400976f9bf6ab8b923d13a068722959d0070" }
typst-html = { git = "https://github.com/typst/typst", rev = "de6f400976f9bf6ab8b923d13a068722959d0070" }
typst-kit = { git = "https://github.com/typst/typst", rev = "de6f400976f9bf6ab8b923d13a068722959d0070", default-features = false, features = ["scan-fonts", "embedded-fonts"] }
typst-library = { git = "https://github.com/typst/typst", rev = "de6f400976f9bf6ab8b923d13a068722959d0070" }
comemo = "0.5"
ecow = "0.2"
