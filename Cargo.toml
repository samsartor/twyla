[package]
name = "twyla"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }

# Pinned to typst main for the bundle export feature (multi-document output,
# `#document(path)` + `#asset()`). Switch back to crates.io once 0.15 ships.
# Bump deliberately; do not let `cargo update -p typst` move us.
typst = { git = "https://github.com/samsartor/typst", rev = "ab7d2a91a5797fc43761e32fb05d7ebab1725358" }
typst-bundle = { git = "https://github.com/samsartor/typst", rev = "ab7d2a91a5797fc43761e32fb05d7ebab1725358" }
# We vendor typst's `compile_impl` fixed-point loop (see src/compile.rs) so
# twyla can sit inside the relayout loop; that loop calls `typst_eval::eval`
# directly, hence a direct dep at the same pinned rev.
typst-eval = { git = "https://github.com/samsartor/typst", rev = "ab7d2a91a5797fc43761e32fb05d7ebab1725358" }
typst-html = { git = "https://github.com/samsartor/typst", rev = "ab7d2a91a5797fc43761e32fb05d7ebab1725358" }
typst-kit = { git = "https://github.com/samsartor/typst", rev = "ab7d2a91a5797fc43761e32fb05d7ebab1725358", default-features = false, features = ["scan-fonts", "embedded-fonts", "watcher", "system-packages", "system-downloader", "emit-diagnostics"] }
typst-library = { git = "https://github.com/samsartor/typst", rev = "ab7d2a91a5797fc43761e32fb05d7ebab1725358" }
# `asset.typst` compiles a stock-typst document in-process and serializes it to
# the requested format: paged layout (`typst-layout`'s `PagedDocument`) feeds
# the SVG/PDF/PNG encoders (`typst-svg`/`typst-pdf`/`typst-render`); the `html`
# format reuses `typst-html` above. Same pinned rev as the rest of typst.
typst-layout = { git = "https://github.com/samsartor/typst", rev = "ab7d2a91a5797fc43761e32fb05d7ebab1725358" }
typst-svg = { git = "https://github.com/samsartor/typst", rev = "ab7d2a91a5797fc43761e32fb05d7ebab1725358" }
typst-pdf = { git = "https://github.com/samsartor/typst", rev = "ab7d2a91a5797fc43761e32fb05d7ebab1725358" }
typst-render = { git = "https://github.com/samsartor/typst", rev = "ab7d2a91a5797fc43761e32fb05d7ebab1725358" }
# Referenced by the `#[func]` macro expansion (`typst_utils::Static`); a
# direct dep so twyla can define native typst builtins. Same pinned rev.
typst-utils = { git = "https://github.com/samsartor/typst", rev = "ab7d2a91a5797fc43761e32fb05d7ebab1725358" }
comemo = "0.5"
ecow = "0.2"

# Path-aware file watcher for `static/` (serve hot-reload). The typst
# watcher only signals "something changed"; this one surfaces the changed
# path so the browser can swap a single asset in place. Already in the
# tree transitively via typst-kit.
notify = "8"

# HTML AST diff harness (porting verification)
html5ever = "0.39"
markup5ever_rcdom = "0.39"

# Markdown → typst draft generator (`twyla import`).
pulldown-cmark = { version = "0.13", default-features = false }
toml = "0.9"
serde_yaml = "0.9"

# Sass/SCSS compiler (pure Rust) for `asset.sass`. Replaces zola's libsass.
# `default-features = false` drops grass's bundled CLI binary (and its clap dep).
grass = { version = "0.13", default-features = false }

# Raster image decode/resize/re-encode for `asset.image`. Already in the tree
# via typst; depending on it directly (and unifying the `avif` feature onto the
# shared build) lets us drive the resize/transcode pipeline. `avif` turns on
# AVIF *encoding* via ravif/rav1e — twyla isn't a lightweight binary (we vendor
# rolldown), so the heavier encoder is fine. Lossy WebP encoding is the one gap
# the pure-Rust `image` stack still has (its WebP encoder is lossless-only), so
# `asset.image`'s `format: "webp"` routes through libwebp via the `webp` crate.
image = { version = "0.25", features = ["avif"] }
webp = "0.3"

# Heading-anchor slugs. Zola's own dependency, so `= My Heading` →
# `id="my-heading"` matches zola's auto-anchors byte-for-byte (including
# unicode transliteration). Used by the native heading HTML rule.
slug = "0.1"
pulldown-cmark-to-cmark = "22.0.0"
unscanny = "0.1.0"

# Render typst-kit's ANSI diagnostics into HTML for the dev server's in-browser
# error page, so the browser shows the same colored output as the terminal.
ansi-to-html = "0.2"

# Terminal styling for twyla's own CLI output (serve logs, convert report).
# Inline `.green()`-style API; `supports-colors` auto-disables off-tty and
# under NO_COLOR. (Diagnostics use typst-kit/termcolor; this is everything we
# print ourselves.)
owo-colors = { version = "4", features = ["supports-colors"] }

iddqd = "0.4.2"

[dev-dependencies]
# Scratch output dir for the `twyla build` integration test (tests/site.rs).
tempfile = "3"
