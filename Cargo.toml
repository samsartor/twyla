[package]
name = "twyla"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }

# Pinned to typst main for the bundle export feature (multi-document output,
# `#document(path)` + `#asset()`). Switch back to crates.io once 0.15 ships.
# Bump deliberately; do not let `cargo update -p typst` move us.
typst = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407" }
typst-bundle = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407" }
# We vendor typst's `compile_impl` fixed-point loop (see src/compile.rs) so
# twyla can sit inside the relayout loop; that loop calls `typst_eval::eval`
# directly, hence a direct dep at the same pinned rev.
typst-eval = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407" }
typst-html = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407" }
typst-kit = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407", default-features = false, features = ["scan-fonts", "embedded-fonts", "system-packages", "system-downloader", "emit-diagnostics"] }
typst-library = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407" }
# `asset.typst` compiles a stock-typst document in-process and serializes it to
# the requested format: paged layout (`typst-layout`'s `PagedDocument`) feeds
# the SVG/PDF/PNG encoders (`typst-svg`/`typst-pdf`/`typst-render`); the `html`
# format reuses `typst-html` above. Same pinned rev as the rest of typst.
typst-layout = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407" }
typst-svg = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407" }
typst-pdf = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407" }
typst-render = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407" }
# Referenced by the `#[func]` macro expansion (`typst_utils::Static`); a
# direct dep so twyla can define native typst builtins. Same pinned rev.
typst-utils = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407" }
comemo = "0.5"
ecow = "0.2"
sha2 = "0.10"
hex = "0.4"

# File watching for `twyla serve` (src/watch.rs). twyla's own watcher on
# top of notify replaces typst-kit's, which only signals "something changed"
# and doesn't survive directory recreation or a dead backend.
notify = "8"

# HTML AST diff harness (porting verification)
html5ever = "0.39"
markup5ever_rcdom = "0.39"

# Markdown → typst draft generator (`twyla import`).
pulldown-cmark = { version = "0.13", default-features = false }
toml = "0.9"
serde_yaml = "0.9"

# Sass/SCSS compiler (pure Rust) for `asset.sass`. Replaces zola's libsass.
# `default-features = false` drops grass's bundled CLI binary (and its clap dep).
grass = { version = "0.13", default-features = false }

# Raster image decode/resize/re-encode for `asset.image`. Already in the tree
# via typst; depending on it directly (and unifying the `avif` feature onto the
# shared build) lets us drive the resize/transcode pipeline. `avif` turns on
# AVIF *encoding* via ravif/rav1e — twyla isn't a lightweight binary (we vendor
# rolldown), so the heavier encoder is fine. Lossy WebP encoding is the one gap
# the pure-Rust `image` stack still has (its WebP encoder is lossless-only), so
# `asset.image`'s `format: "webp"` routes through libwebp via the `webp` crate.
image = { version = "0.25", features = ["avif"] }
webp = "0.3"

# Heading-anchor slugs. Zola's own dependency, so `= My Heading` →
# `id="my-heading"` matches zola's auto-anchors byte-for-byte (including
# unicode transliteration). Used by the native heading HTML rule.
slug = "0.1"
pulldown-cmark-to-cmark = "22.0.0"
unscanny = "0.1.0"

# Render typst-kit's ANSI diagnostics into HTML for the dev server's in-browser
# error page, so the browser shows the same colored output as the terminal.
ansi-to-html = "0.2"

# Terminal styling for twyla's own CLI output (serve logs, convert report).
# Inline `.green()`-style API; `supports-colors` auto-disables off-tty and
# under NO_COLOR. (Diagnostics use typst-kit/termcolor; this is everything we
# print ourselves.)
owo-colors = { version = "4", features = ["supports-colors"] }

iddqd = "0.4.2"

# SVG minifier (svgo port) for `asset.svg`. We call its parse → optimize →
# serialize stages directly (rather than `optimize_with_config`) so the root
# `id` attribute can be injected on the parsed tree before serialization.
svgm-core = "0.3"

# JS/TS/JSX bundler for `asset.js`. rolldown is consumed as a Rust library, so
# no JS ever runs: no node, no JS config files, no JS plugins. Twyla supplies
# the filesystem (src/asset/js.rs's `SandboxFs`), which confines every read to
# the project root, refuses all writes, and records each access in the dep
# ledger. The sub-crates are exact-pinned to rolldown's own version: their
# APIs (the `FileSystem` traits, `Plugin` hooks, `Resolver::new`) are internal
# to rolldown and shift between releases, and `oxc_resolver` must be the exact
# version rolldown_fs implements its trait for. Bump them together,
# deliberately. rolldown is async; tokio drives one build at a time.
rolldown = "=1.3.2"
rolldown_plugin = "=1.3.2"
rolldown_fs = { version = "=1.3.2", features = ["os"] }
rolldown_resolver = "=1.3.2"
rolldown_common = "=1.3.2"
oxc_resolver = "=11.24.3"
arcstr = "1"
rolldown_error = "=1.3.2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"

# The musl release is a fully static binary (runs on any x86_64 Linux,
# regardless of glibc version), so there's no system OpenSSL to link against:
# build typst-kit's package downloader against a vendored copy. Cargo unifies
# this feature onto the main typst-kit dependency above.
[target.'cfg(target_env = "musl")'.dependencies]
typst-kit = { git = "https://github.com/samsartor/typst", rev = "84b4a97aabfabb7311dcf0cd9af08b0f7e631407", default-features = false, features = ["vendor-openssl"] }

[dev-dependencies]
# Scratch output dir for the `twyla build` integration test (tests/site.rs).
tempfile = "3"
