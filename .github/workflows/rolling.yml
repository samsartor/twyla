name: rolling
on:
  push:
    branches: [main]
concurrency:
  group: rolling-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: tar czf twyla-x86_64-unknown-linux-gnu.tar.gz -C target/release twyla
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest (main)" \
            --notes "Rolling build from $GITHUB_SHA" \
            twyla-x86_64-unknown-linux-gnu.tar.gz
      # Build twyla.dev with the binary we just compiled, so the site always
      # reflects this exact commit (no waiting on a separate release pickup).
      # --test-examples gates the deploy: a broken example/code block fails here.
      - run: ./target/release/twyla build --root doc --base-url https://twyla.dev --reflect --test-examples
      - name: Deploy doc/public to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy doc/public --project-name=twyla --branch=main
